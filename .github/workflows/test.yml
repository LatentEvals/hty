name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: aarch64-macos
            # Zig 0.15.2 cannot link against the Xcode 26.4+ SDK
            # (https://codeberg.org/ziglang/zig/issues/31658 — every libSystem
            # symbol comes back undefined). Pin the older Xcode still present
            # on the macos-26 image until we move to a Zig with the fix.
            developer_dir: /Applications/Xcode_26.3.app/Contents/Developer
          - os: ubuntu-latest
            name: x86_64-linux
          - os: ubuntu-24.04-arm
            name: aarch64-linux
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          # `build.zig` runs `git describe --tags` at build time so
          # `hty info` / `hty --version` can surface real version info.
          # The default shallow checkout has no tags, which would force
          # every CI build into the "no git info" fallback.
          fetch-depth: 0
          fetch-tags: true

      - name: install zig
        uses: montanaflynn/setup-zig@main
        with:
          version: 0.15.2

      - name: install test dependencies (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nano emacs-nox

      - name: install test dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install nano emacs

      - name: build
        run: zig build

      - name: test
        run: zig build test
