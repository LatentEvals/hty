name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: hty-aarch64-macos
          - os: ubuntu-latest
            name: hty-x86_64-linux
          - os: ubuntu-24.04-arm
            name: hty-aarch64-linux
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install zig
        uses: montanaflynn/setup-zig@main
        with:
          version: 0.15.2

      - name: build release binary
        run: zig build -Doptimize=ReleaseFast

      - name: package
        run: |
          mkdir -p dist
          cp zig-out/bin/hty dist/hty
          cd dist
          tar -czf ${{ matrix.name }}.tar.gz hty
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256
          ls -la

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.tar.gz
            dist/${{ matrix.name }}.tar.gz.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: flatten
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} upload/ \;
          ls -la upload

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  homebrew:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: download sha256 files
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: read sha256 values
        id: sha
        run: |
          for name in hty-aarch64-macos hty-x86_64-linux hty-aarch64-linux; do
            sha=$(cat dist/${name}/${name}.tar.gz.sha256 | awk '{print $1}')
            key=$(echo "$name" | tr '-' '_')
            echo "${key}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: generate formula
        run: |
          cat > hty.rb << 'FORMULA'
          class Hty < Formula
            desc "Interactive terminal automation for AI agents"
            homepage "https://github.com/montanaflynn/hty"
            version "${{ steps.version.outputs.version }}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/montanaflynn/hty/releases/download/v#{version}/hty-aarch64-macos.tar.gz"
                sha256 "${{ steps.sha.outputs.hty_aarch64_macos }}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/montanaflynn/hty/releases/download/v#{version}/hty-x86_64-linux.tar.gz"
                sha256 "${{ steps.sha.outputs.hty_x86_64_linux }}"
              end
              on_arm do
                url "https://github.com/montanaflynn/hty/releases/download/v#{version}/hty-aarch64-linux.tar.gz"
                sha256 "${{ steps.sha.outputs.hty_aarch64_linux }}"
              end
            end

            def install
              bin.install "hty"
            end

            test do
              assert_match "Usage", shell_output("#{bin}/hty --help")
            end
          end
          FORMULA
          # fix indentation (heredoc adds leading spaces)
          sed -i 's/^          //' hty.rb
          cat hty.rb

      - name: push to homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA=$(gh api repos/montanaflynn/homebrew-tap/contents/Formula/hty.rb --jq '.sha' 2>/dev/null || echo "")
          CONTENT=$(base64 -w0 hty.rb)
          if [ -n "$SHA" ]; then
            gh api repos/montanaflynn/homebrew-tap/contents/Formula/hty.rb \
              -X PUT \
              -f message="update hty to ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT" \
              -f sha="$SHA" \
              --jq '.commit.sha'
          else
            gh api repos/montanaflynn/homebrew-tap/contents/Formula/hty.rb \
              -X PUT \
              -f message="add hty ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT" \
              --jq '.commit.sha'
          fi
